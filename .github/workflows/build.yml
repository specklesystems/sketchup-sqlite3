name: build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '3.4.9'
      - run: bash tools/build-windows.sh 3.4
      - run: ruby tools/smoke.rb "Release (3.4)/x64/sqlite3_34.so"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite3_34-windows-x64
          path: Release (3.4)/x64/sqlite3_34.so
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '3.4.9'
      - run: bash tools/build-mac.sh 3.4
      - run: bash tools/smoke-mac.sh "Release (3.4)/sqlite3_34.bundle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite3_34-macos-arm64
          path: Release (3.4)/sqlite3_34.bundle
          if-no-files-found: error
